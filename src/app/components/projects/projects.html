<section id="projects" class="projects-section container py-5">
  <div class="projects-heading text-center mb-5">
    <p class="section-eyebrow mb-2">Portfólio</p>

    <h2 class="fw-bold">Projetos em destaque</h2>

    <p class="text-secondary">
      Alguns projetos que demonstram minha experiência prática com desenvolvimento web,
      desktop e sistemas interativos em Unity.
    </p>
  </div>

  <div class="row g-4 align-items-start">
    @for (project of projects; track project.title) {
      <div class="col-md-6 col-xl-4">
        <app-project-card [project]="project"></app-project-card>
      </div>
    }
  </div>
</section>
