<section id="projects" class="container section-space section-divider">
  <div class="section-heading">
    <p class="section-eyebrow mb-2">Portfólio</p>
    <h2>Projetos em destaque</h2>
    <p class="text-secondary">
      Projetos para clientes e estudos de desenvolvimento web, desktop e jogos.
    </p>
  </div>

  <div class="projects-grid">
    @for (project of projects; track project.title) {
      <app-project-card [project]="project"></app-project-card>
    }
  </div>
</section>
