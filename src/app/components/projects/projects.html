<section id="projects" class="container section-space section-divider">
  <div class="section-heading">
    <p class="section-eyebrow mb-2">{{ copy().eyebrow }}</p>
    <h2>{{ copy().heading }}</h2>
    <p class="text-secondary">
      {{ copy().description }}
    </p>
  </div>

  <div class="projects-grid">
    @for (project of projects(); track project.key) {
      <app-project-card [project]="project.value"></app-project-card>
    }
  </div>
</section>
