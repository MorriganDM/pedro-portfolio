<section id="contact" class="container section-space section-divider">
  <div class="contact-card">
    <div class="row g-4 align-items-center">
      <div class="col-lg-7">
        <p class="section-eyebrow mb-2">
          {{ copy().eyebrow }}
        </p>

        <h2 class="contact-title fw-bold mb-3">
          {{ copy().heading }}
        </h2>

        <p class="contact-text mb-0">
          {{ copy().description }}
        </p>
      </div>

      <div class="col-lg-5">
        <div class="contact-actions">
          <a
            class="contact-link"
            href="https://github.com/MorriganDM"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i aria-hidden="true" class="bi bi-github"></i>

            <span>
              <strong>GitHub</strong>
              <small>{{ copy().repositories }}</small>
            </span>
          </a>

          <a
            class="contact-link"
            href="https://www.linkedin.com/in/pedro-nascimento-32747633a/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <i aria-hidden="true" class="bi bi-linkedin"></i>

            <span>
              <strong>LinkedIn</strong>
              <small>{{ copy().connect }}</small>
            </span>
          </a>

          <a
            class="contact-link"
            href="mailto:pedrovicthorcordeiro@gmail.com"
          >
            <i aria-hidden="true" class="bi bi-envelope"></i>

            <span>
              <strong>{{ copy().email }}</strong>
              <small>{{ copy().message }}</small>
            </span>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
