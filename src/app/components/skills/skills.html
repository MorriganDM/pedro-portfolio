<section id="skills" class="skills-section container py-5">
  <div class="skills-heading text-center mb-5">
    <p class="section-eyebrow mb-2">Stack técnica</p>

    <h2 class="fw-bold">
      Habilidades
    </h2>

    <p class="text-secondary">
      Tecnologias e ferramentas que uso em projetos de software, web e jogos.
    </p>
  </div>

  <div class="row g-4">
    @for (category of skillCategories; track category.title) {
      <div class="col-md-6 col-xl-3">
        <article class="skill-card h-100">
          <div class="skill-icon mb-3">
            <i [class]="category.icon"></i>
          </div>

          <h3 class="h5 fw-bold mb-2">
            {{ category.title }}
          </h3>

          <p class="skill-description">
            {{ category.description }}
          </p>

          <div class="d-flex flex-wrap gap-2">
            @for (skill of category.skills; track skill) {
              <span class="skill-badge">
                {{ skill }}
              </span>
            }
          </div>
        </article>
      </div>
    }
  </div>
</section>
