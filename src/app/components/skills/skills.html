<section id="skills" class="container section-space section-divider" aria-labelledby="skills-title">
  <div class="section-heading">
    <h2 id="skills-title">Habilidades</h2>
    <p class="text-secondary">Tecnologias usadas no trabalho, em projetos para clientes e em estudos.</p>
  </div>

  <div class="skills-grid">
    @for (category of skillCategories; track category.title) {
      <article class="skill-card">
        <div class="skill-heading">
          <span class="skill-icon"><i [class]="category.icon" aria-hidden="true"></i></span>
          <h3>{{ category.title }}</h3>
        </div>
        <p class="skill-description">{{ category.description }}</p>
        <ul class="skill-tags list-unstyled">
          @for (skill of category.skills; track skill) {
            <li class="tech-tag">{{ skill }}</li>
          }
        </ul>
      </article>
    }
  </div>
</section>
