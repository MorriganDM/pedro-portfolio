<header class="site-header">
  <nav class="container" [attr.aria-label]="copy().navigation">
    <div class="header-content">
      <a class="brand" [href]="language.sectionHref()">
        <span class="brand-mark" aria-hidden="true"><i class="bi bi-code-slash"></i></span>
        Pedro Nascimento
      </a>

      <div class="nav-links">
        <a [href]="language.sectionHref('projects')">{{ copy().projects }}</a>
        <a [href]="language.sectionHref('about')">{{ copy().about }}</a>
        <a [href]="language.sectionHref('skills')">{{ copy().skills }}</a>
        <a [href]="language.sectionHref('contact')">{{ copy().contact }}</a>
      </div>

      <div class="language-switch" role="group" [attr.aria-label]="copy().language">
        <a [href]="language.href('pt')" (click)="language.select($event, 'pt')"
          [attr.aria-current]="language.language() === 'pt' ? 'page' : null"
          lang="pt-BR" hreflang="pt-BR" aria-label="Português do Brasil">PT</a>
        <a [href]="language.href('en')" (click)="language.select($event, 'en')"
          [attr.aria-current]="language.language() === 'en' ? 'page' : null"
          lang="en" hreflang="en" aria-label="English">EN</a>
      </div>
    </div>
  </nav>
</header>
